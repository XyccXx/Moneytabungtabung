<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEEED">
<meta name="description" content="DompetKu, pencatat keuangan dan target tabungan pribadi">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DompetKu</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEEEED;--card:#fff;--ink:#0A0A0A;--mute:#8B8F8C;--line:#E2E3E1;--soft:#F2F2F1;--neon:#35E58E;--coral:#FF5A5F;--amber:#FFC145;--dark:#0A0A0A;--darkt:#F4F4F3;--gray:#D6D7D5;--hatch:repeating-linear-gradient(135deg,rgba(10,10,10,.22) 0 2px,transparent 2px 7px);--f:'Instrument Sans',system-ui,-apple-system,sans-serif}
[data-theme=dark]{--bg:#080808;--card:#151515;--ink:#F4F4F3;--line:#262626;--soft:#222;--dark:#1F1F1F;--gray:#363636;--hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 2px,transparent 2px 7px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;letter-spacing:-.01em;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit;outline:0;border:0;width:100%}
#app{max-width:440px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
svg{flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:5px;font-weight:600;text-transform:capitalize}
.pill span{padding:0 8px}
.ib{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft)}
.ib:disabled{opacity:.3}
.ib.card{background:var(--card)}
.ava{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
.tr2{display:flex;gap:8px;align-items:center}
h1{font-size:30px;font-weight:600;letter-spacing:-.04em}
h2{font-size:19px;font-weight:600;letter-spacing:-.03em}
h3{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:4px 0 16px}
.big{font-size:clamp(34px,11.5vw,48px);font-weight:500;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:22px;color:var(--mute);letter-spacing:-.02em;margin-right:3px;font-weight:500}
.mute{color:var(--mute)}
.bal{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 10px;margin-bottom:14px}
.bal .mute{font-weight:600;font-size:14px;text-align:right;padding-bottom:4px;margin-left:auto}
.seg{display:flex;gap:5px}
.seg i{flex:1;height:12px;border-radius:99px;background:var(--hatch),var(--soft);overflow:hidden;display:block}
.seg b{display:block;height:100%;border-radius:99px;background:var(--ink)}
.seg.over b{background:var(--coral)}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 20px;font-size:13px;font-weight:600}
.chip{background:var(--neon);color:#0A0A0A;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.neg{background:var(--coral)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;border-radius:28px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--dark);color:var(--darkt);overflow:hidden}
.tile.coral{background:var(--coral);color:#0A0A0A}
.tile.neon{background:var(--neon);color:#0A0A0A}
.tile .go{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:#fff;color:#0A0A0A;display:flex;align-items:center;justify-content:center}
.tile b{font-size:17px;font-weight:600;letter-spacing:-.03em}
.tile small{display:block;font-size:12.5px;opacity:.7;margin-top:2px;font-weight:500}
.tile .tp{position:absolute;top:16px;left:16px;font-size:13px;font-weight:700;opacity:.85}
.tile .mini{height:6px;border-radius:9px;margin-top:10px;background:rgba(255,255,255,.18);overflow:hidden}
.tile.coral .mini,.tile.neon .mini{background:rgba(0,0,0,.15)}
.tile .mini i{display:block;height:100%;background:var(--neon);border-radius:9px}
.tile.coral .mini i,.tile.neon .mini i{background:#0A0A0A}
.card{background:var(--card);border-radius:32px;padding:20px;margin-bottom:12px}
.card>.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.gwrap{position:relative;margin:4px 0 16px}
.gwrap svg{width:100%;display:block}
.gc{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gc small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.gc b{font-size:30px;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.gpill{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px;font-weight:600}
.gpill .c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.35);color:inherit}
.gpill .c.n{background:var(--neon);color:#0A0A0A}
.gpill .c:disabled{opacity:.3}
.gnote{text-align:center;font-size:13px;font-weight:600;color:var(--mute);margin-top:12px}
.crow{margin-bottom:16px}.crow:last-child{margin-bottom:0}
.crow-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.crow-h b{font-weight:600}.crow-h span{font-size:12.5px;color:var(--mute);font-weight:500}
.hb{height:22px;border-radius:99px;background:var(--hatch),var(--soft);overflow:hidden}
.hb i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.hb.neon i{background:var(--neon)}
.crow-v{text-align:right;font-size:12.5px;font-weight:600;margin-top:6px}
.lim{display:flex;align-items:center;gap:12px}
.lim .ic{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700}
.lim>div:nth-child(2){flex:1}.lim b{font-size:22px;font-weight:600;letter-spacing:-.04em}
.lim small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.trend{display:flex;gap:8px;align-items:flex-end;height:120px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--mute);font-weight:600}
.trend i{display:block;width:100%;border-radius:12px;background:var(--neon);min-height:6px}
.trend i.n{background:var(--coral)}.trend i.z{background:var(--hatch),var(--soft)}
.trend .on{color:var(--ink)}
.hero{background:var(--neon);color:#0A0A0A;border-radius:32px;padding:20px;margin-bottom:14px}
.hero .hb{background:var(--hatch),rgba(255,255,255,.45);height:34px}
.hero .hb i{background:#0A0A0A}
.hero .big small{color:rgba(0,0,0,.5)}
.hero .row2{display:flex;justify-content:space-between;align-items:flex-end;margin:46px 0 14px}
.hero .row2 span{font-weight:600}
.hero .ib{background:#0A0A0A;color:var(--neon)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dk{background:var(--dark);color:var(--darkt);border-radius:32px;padding:6px 18px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:16px 0;border-bottom:1px solid rgba(128,128,128,.22)}
.trow:last-child{border:0}
.ti{width:46px;height:46px;border-radius:50%;background:rgba(128,128,128,.22);display:flex;align-items:center;justify-content:center;color:var(--coral);flex-shrink:0}
.ti.in{color:var(--neon)}
.tl{flex:1;min-width:0}
.tsub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn{display:inline-flex;align-items:center;gap:8px}
.ci{width:28px;height:28px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.seg2 button{display:flex;align-items:center;justify-content:center;gap:6px}
.tamt{font-size:24px;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.tsub{font-size:13px;margin-top:4px;opacity:.75;font-weight:500}
.tr{text-align:right;font-size:13px;opacity:.75;font-weight:600}
.tr em{display:block;font-style:normal;font-size:12px;opacity:.7;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--coral)}
.dot.in{background:var(--neon)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.cd{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:var(--soft)}
.cd.ok{background:var(--neon);color:#0A0A0A}
.cd.use{background:var(--hatch),var(--soft);color:var(--mute)}
.cd.fut{background:none;color:var(--mute);opacity:.5}
.cd.sel{background:var(--ink);color:var(--bg);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--mute);margin-top:14px}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:50%;background:var(--neon);display:inline-block}
.leg i.h{background:var(--hatch),var(--gray)}
.dayh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px}
.dayh .t{font-size:34px;font-weight:500;letter-spacing:-.05em}
.fil{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.fc{padding:9px 16px;border-radius:99px;background:var(--card);font-weight:600;font-size:13.5px;white-space:nowrap}
.fc.on{background:var(--ink);color:var(--bg)}
.search{background:var(--card);border-radius:99px;padding:14px 18px;margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-weight:500}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.mrow .ic{width:42px;height:42px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.mrow>div:nth-child(2),.mrow>div:first-child:not(.ic){flex:1;font-weight:600}
.mrow small{display:block;color:var(--mute);font-weight:500;font-size:12.5px}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prof .ava{width:64px;height:64px;font-size:26px}
.prof input{font-size:22px;font-weight:600;letter-spacing:-.03em;background:none}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),412px);display:flex;gap:10px;z-index:20}
.np{flex:1;display:flex;gap:4px;padding:6px;border-radius:99px;background:#0A0A0A;box-shadow:0 12px 30px rgba(0,0,0,.25)}
[data-theme=dark] .np{background:#222}
.nt{flex:0 0 54px;height:52px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:7px;color:#8B8F8C;font-weight:700;font-size:14px}
.nt.on{background:var(--neon);color:#0A0A0A}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:34px 34px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1.04)}
.ov.on .sheet{transform:none}
.grab{display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:14px}
label input,label select{background:var(--soft);border-radius:18px;padding:15px 16px;font-size:16px;margin-top:6px;color:var(--ink)}
label input:focus{box-shadow:0 0 0 3px var(--neon)}
.hint{font-size:13px;font-weight:600;margin:-8px 0 14px;color:var(--mute)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:99px;margin-bottom:16px}
.seg2 button{padding:12px;border-radius:99px;text-align:center;font-weight:600}
.seg2 button.in{background:var(--neon);color:#0A0A0A}.seg2 button.out{background:var(--coral);color:#0A0A0A}.seg2 button.on3{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.chips button{padding:9px 14px;border-radius:99px;background:var(--soft);font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chips button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:16px;border-radius:99px;font-weight:700;text-align:center;background:var(--soft)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.neon{background:var(--neon);color:#0A0A0A}
.btn.red{background:var(--coral);color:#0A0A0A}
.btn.sm{padding:12px;font-size:14px}
.gd{font-size:44px}
.log{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
details{margin:0 0 14px;font-size:12.5px;color:var(--mute)}
pre{background:var(--soft);padding:12px;border-radius:14px;overflow-x:auto;margin-top:8px;color:var(--ink);font-size:11.5px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;transition:transform .3s;z-index:90;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* ===== animasi ===== */
@keyframes slin{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}}
@keyframes fillbar{from{clip-path:inset(0 100% 0 0 round 99px)}to{clip-path:inset(0 0 0 0 round 99px)}}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes riseb{from{clip-path:inset(100% 0 0 0 round 12px)}to{clip-path:inset(0 0 0 0 round 12px)}}
@keyframes pop{from{transform:scale(.55)}}
.enter>*{animation:slin .65s cubic-bezier(.2,.8,.2,1) both}
.enter>:nth-child(1){animation-delay:0ms}
.enter>:nth-child(2){animation-delay:55ms}
.enter>:nth-child(3){animation-delay:110ms}
.enter>:nth-child(4){animation-delay:165ms}
.enter>:nth-child(5){animation-delay:220ms}
.enter>:nth-child(6){animation-delay:275ms}
.enter>:nth-child(7){animation-delay:330ms}
.enter>:nth-child(8){animation-delay:385ms}
.enter>:nth-child(9){animation-delay:440ms}
.enter>:nth-child(10){animation-delay:495ms}
.enter>:nth-child(11){animation-delay:550ms}
.enter>:nth-child(12){animation-delay:605ms}
.enter>:nth-child(13){animation-delay:660ms}
.enter>:nth-child(14){animation-delay:715ms}
.enter .seg b,.enter .hb i,.enter .mini i{animation:fillbar 1s .35s cubic-bezier(.2,.8,.2,1) both}
.enter .gwrap svg{animation:sweep 1s .3s cubic-bezier(.3,.7,.2,1) both}
.enter .trend i{animation:riseb .9s .4s cubic-bezier(.2,.8,.2,1) both}
.enter .trend>div:nth-child(2) i{animation-delay:.47s}.enter .trend>div:nth-child(3) i{animation-delay:.54s}
.enter .trend>div:nth-child(4) i{animation-delay:.61s}.enter .trend>div:nth-child(5) i{animation-delay:.68s}.enter .trend>div:nth-child(6) i{animation-delay:.75s}
.cd.sel{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
.tile,.btn,.ib,.cd,.fc,.trow,.mrow,.avatar,.ava,.gpill .c,.chips button{transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.tile:active,.btn:active,.ib:active,.cd:active,.fc:active,.trow:active,.mrow:active,.ava:active,.gpill .c:active,.chips button:active{transform:scale(.95)}
.nt{transition:flex-grow .45s cubic-bezier(.2,.9,.25,1),background-color .3s,color .3s;gap:0}
.nt span{display:inline-block;max-width:0;opacity:0;margin-left:0;overflow:hidden;white-space:nowrap;transition:max-width .45s cubic-bezier(.2,.9,.25,1),opacity .3s .08s,margin-left .45s}
.nt.on span{max-width:90px;opacity:1;margin-left:7px}
.nt.on{flex:1 0 54px}
.nt:not(.on){flex:0 0 54px}
/* gerak ikon navigasi */
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-7px) scale(.95,1.08)}55%{transform:translateY(0) scale(1.12,.88)}75%{transform:translateY(-2px)}100%{transform:none}}
@keyframes spinp{0%{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(1.28)}100%{transform:rotate(360deg) scale(1)}}
@keyframes swing{0%{transform:rotate(0)}20%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}70%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes bobu{0%{transform:scale(1)}30%{transform:translateY(-5px) scale(1.15)}60%{transform:translateY(1px) scale(.95)}100%{transform:none}}
.nt svg{transform-origin:50% 40%}
.nt.on[data-v=home] svg{animation:hop .65s cubic-bezier(.3,.8,.3,1)}
.nt.on[data-v=goal] svg{animation:spinp .8s cubic-bezier(.3,.7,.3,1)}
.nt.on[data-v=hist] svg{animation:swing .7s ease-out;transform-origin:50% 8%}
.nt.on[data-v=me] svg{animation:bobu .6s cubic-bezier(.3,.8,.3,1)}
.nt:not(.on):active svg{transform:scale(.82);transition:transform .12s}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav id="nav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ========== Data ========== */
const KEY = 'dompetku.v2';
const $ = (s, r = document) => r.querySelector(s);
const DEF = () => ({
  user: '', theme: 'auto', limit: 0,
  cats: { in: ['Gaji', 'Freelance', 'Bonus', 'Investasi', 'Lainnya'], out: ['Makan', 'Transport', 'Belanja', 'Tagihan', 'Hiburan', 'Kesehatan', 'Lainnya'] },
  tx: [], goals: [], hook: { discord: '', script: '', sheet: '' }
});
function fromOld(o) {
  const d = DEF();
  if (o.transactions) d.tx = o.transactions.map(t => ({ id: t.id, t: t.type === 'income' ? 'in' : 'out', n: t.name || t.category || '', a: +t.amount || 0, c: t.category || 'Lainnya', d: t.date, note: t.note || '' }));
  if (o.categories) d.cats = { in: o.categories.income || d.cats.in, out: o.categories.expense || d.cats.out };
  if (o.savings) d.goals = o.savings.map(s => ({ id: s.id, n: s.name, tg: +s.target || 0, cur: +s.current || 0, due: s.deadline || '', log: [] }));
  const st = o.settings;
  if (st) {
    d.user = st.userName && st.userName !== 'Pengguna' ? st.userName : '';
    d.hook = { discord: st.discordWebhook || '', script: st.scriptUrl || '', sheet: st.sheetUrl || '' };
  }
  if (o.theme === 'dark' || o.theme === 'light') d.theme = o.theme;
  return d;
}
function migrate() {
  try {
    const g = k => JSON.parse(localStorage.getItem(k) || 'null');
    return fromOld({ transactions: g('dk_transactions'), categories: g('dk_categories'), savings: g('dk_savings'), settings: g('dk_settings'), theme: g('dk_theme') });
  } catch (e) { return DEF(); }
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return { ...DEF(), ...JSON.parse(raw) }; } catch (e) {}
  return migrate();
}
let D = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Penyimpanan penuh'); } };

/* ========== Helpers ========== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  </div>
  ${sel ? `<div class="dayh"><div class="t">${new Date(sel + 'T12:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long' })}</div><span class="chip ${dd && dd.o > dd.i ? 'neg' : ''}">${dd ? rs(dd.i - dd.o) : 'Rp 0'}</span></div>
  ${dcs.length ? `<div class="card">${dcs.map(([n, a]) => `<div class="crow"><div class="crow-h"><b class="cn"><i class="ci">${catIco(n, 'out', 15)}</i>${esc(n)}</b><span>dari ${rs(dd.o)} keluar</span></div><div class="hb"><i style="width:${a / dd.o * 100}%"></i></div><div class="crow-v">${rp(a)}</div></div>`).join('')}</div>` : ''}
  ${dd ? `<div class="dk">${dd.l.map(trow).join('')}</div>` : '<div class="empty">Belum ada transaksi di hari ini</div>'}` : ''}
  <h2 style="margin:24px 0 6px">Semua transaksi</h2>
  <input class="search" id="q" placeholder="Cari nama, kategori, catatan" value="${esc(UI.q)}">
  <div class="fil">${[['all', 'Semua'], ['in', 'Pemasukan'], ['out', 'Pengeluaran']].map(([v, l]) => `<button class="fc ${UI.ft === v ? 'on' : ''}" data-a="ft" data-v="${v}">${l}</button>`).join('')}</div>
  <div id="hlist">${histList()}</div>`;
};

/* ========== Akun ========== */
V.me = () => `
  <div class="top"><h1>Akun</h1></div>
  <div class="card">
    <div class="prof"><div class="ava">${esc((D.user || 'D').trim().charAt(0).toUpperCase())}</div><input id="u-n" placeholder="Nama kamu" value="${esc(D.user)}"></div>
    <div class="lbl" style="margin-bottom:8px">Tema</div>
    <div class="seg2" style="grid-template-columns:repeat(3,1fr);margin:0">${[['light', 'Terang'], ['dark', 'Gelap'], ['auto', 'Otomatis']].map(([v, l]) => `<button class="${D.theme === v ? 'on3' : ''}" data-a="setTheme" data-v="${v}">${l}</button>`).join('')}</div>
  </div>
  <div class="card">
    <button class="mrow" data-a="limit"><div class="ic">${ico('goal', 19)}</div><div>Batas pengeluaran<small>${D.limit > 0 ? rp(D.limit) + ' per bulan' : 'Belum diatur'}</small></div>${ico('r', 18)}</button>
    <button class="mrow" data-a="cats"><div class="ic">${ico('hist', 19)}</div><div>Kategori<small>${D.cats.in.length + D.cats.out.length} kategori</small></div>${ico('r', 18)}</button>
    <button class="mrow" data-a="hooks"><div class="ic">${ico('arr', 19)}</div><div>Integrasi<small>Discord dan Google Spreadsheet</small></div>${ico('r', 18)}</button>
  </div>
  <div class="card">
    <button class="mrow" data-a="export"><div class="ic">${ico('arr', 19)}</div><div>Unduh backup<small>Simpan semua data ke file JSON</small></div>${ico('r', 18)}</button>
    <button class="mrow" data-a="import"><div class="ic">${ico('plus', 19)}</div><div>Pulihkan backup<small>Dari file JSON DompetKu</small></div>${ico('r', 18)}</button>
    <button class="mrow" data-a="reset"><div class="ic" style="background:var(--coral);color:#0A0A0A">${ico('x', 19)}</div><div>Hapus semua data<small>Tidak bisa dibatalkan</small></div>${ico('r', 18)}</button>
  </div>
  <input type="file" id="imp" accept=".json,application/json" hidden>
  <div class="empty">DompetKu v2</div>`;

/* ========== Transaksi ========== */
let TX = {};
function paintTx() {
  document.querySelectorAll('#tx-seg button').forEach(b => b.className = b.dataset.v === TX.t ? TX.t : '');
  $('#tx-cats').innerHTML = D.cats[TX.t].map(c => `<button class="${c === TX.c ? 'on' : ''}" data-a="txCat" data-v="${esc(c)}">${catIco(c, TX.t, 15)}${esc(c)}</button>`).join('') + `<button data-a="txCatNew">${ico('plus', 14)} Baru</button>`;
}
function txSheet(id, type) {
  const t = id ? D.tx.find(x => x.id === id) : null;
  TX = { id: id || null, t: t ? t.t : (type || 'out'), c: t ? t.c : null };
  if (!t) TX.c = D.cats[TX.t][0] || null;
  openSheet(`<h3>${t ? 'Ubah transaksi' : 'Catat transaksi'}</h3>
  <div class="seg2" id="tx-seg"><button data-a="txType" data-v="in">${ico('down', 16)}Pemasukan</button><button data-a="txType" data-v="out">${ico('arr', 16)}Pengeluaran</button></div>
  <label>Nominal (Rp), bisa dihitung seperti 15000+2500*2<input id="f-a" inputmode="decimal" placeholder="0" value="${t ? t.a : ''}"></label>
  <div class="hint" id="f-prev"></div>
  <label>Nama (opsional)<input id="f-n" placeholder="mis. Makan siang" value="${esc(t ? t.n : '')}"></label>
  <div class="lbl">Kategori</div><div class="chips" id="tx-cats"></div>
  <label>Tanggal<input id="f-d" type="date" value="${t ? t.d : TODAY()}"></label>
  <label>Catatan (opsional)<input id="f-note" value="${esc(t ? t.note : '')}"></label>
  <div class="row"><button class="btn" data-a="close">Batal</button>${t ? '<button class="btn red" data-a="txDel" data-id="' + t.id + '">Hapus</button>' : ''}<button class="btn dark" data-a="txSave">Simpan</button></div>`);
  paintTx();
}
async function notify(t) {
  const u = D.hook.discord; if (!u) return;
  const bal = D.tx.reduce((s, x) => x.t === 'in' ? s + x.a : s - x.a, 0);
  try {
    await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ embeds: [{ title: (t.t === 'in' ? '💚 Pemasukan' : '💸 Pengeluaran') + ' baru', color: t.t === 'in' ? 3066993 : 15158332, fields: [
      { name: 'Nama', value: t.n || '-', inline: true }, { name: 'Kategori', value: t.c || '-', inline: true }, { name: 'Nominal', value: rp(t.a), inline: true },
      { name: 'Tanggal', value: t.d, inline: true }, { name: 'Saldo total', value: rp(bal), inline: true }, ...(t.note ? [{ name: 'Catatan', value: t.note }] : [])
    ], footer: { text: 'DompetKu' }, timestamp: new Date().toISOString() }] }) });
  } catch (e) {}
}
async function sync(t, action) {
  const u = D.hook.script; if (!u) return;
  const body = action === 'delete' ? { action: 'delete', id: t.id } : { action: 'add', id: t.id, tanggal: t.d, nama: t.n, jenis: t.t === 'in' ? 'Pemasukan' : 'Pengeluaran', kategori: t.c, nominal: t.a, catatan: t.note || '' };
  try { await fetch(u, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); } catch (e) {}
}
function confirmSheet(title, msg, act, id) {
  openSheet(`<h3>${title}</h3><p class="mute" style="margin-bottom:18px;font-weight:500">${msg}</p><div class="row"><button class="btn" data-a="close">Batal</button><button class="btn red" data-a="${act}" data-id="${id || ''}">Hapus</button></div>`);
}

/* ========== Sheet lain ========== */
function catSheet() {
  const T = UI.ctype;
  openSheet(`<h3>Kategori</h3>
  <div class="seg2"><button class="${T === 'in' ? 'in' : ''}" data-a="ctype" data-v="in">${ico('down', 16)}Pemasukan</button><button class="${T === 'out' ? 'out' : ''}" data-a="ctype" data-v="out">${ico('arr', 16)}Pengeluaran</button></div>
  <div class="chips">${D.cats[T].map((c, i) => `<button data-a="cdel" data-i="${i}">${catIco(c, T, 15)}${esc(c)} ${ico('x', 13)}</button>`).join('')}</div>
  <label>Kategori baru<input id="c-n" placeholder="Nama kategori"></label>
  <div class="row"><button class="btn" data-a="close">Selesai</button><button class="btn dark" data-a="cadd">Tambah</button></div>`);
}
function hookSheet() {
  openSheet(`<h3>Integrasi</h3>
  <label>Discord Webhook URL<input id="h-d" type="url" placeholder="https://discord.com/api/webhooks/..." value="${esc(D.hook.discord)}"></label>
  <label>URL Google Apps Script<input id="h-s" type="url" placeholder="https://script.google.com/..." value="${esc(D.hook.script)}"></label>
  <label>Link Google Spreadsheet<input id="h-l" type="url" placeholder="https://docs.google.com/spreadsheets/..." value="${esc(D.hook.sheet)}"></label>
  <details><summary>Contoh Apps Script</summary><pre>function doPost(e) {
  var d = JSON.parse(e.postData.contents);
  SpreadsheetApp.getActiveSheet().appendRow([
    d.tanggal, d.nama, d.jenis,
    d.kategori, d.nominal, d.catatan
  ]);
  return ContentService.createTextOutput('OK');
}</pre></details>
  <div class="row"><button class="btn" data-a="close">Batal</button>${D.hook.sheet ? '<button class="btn" data-a="openSheetLink">Buka</button>' : ''}<button class="btn dark" data-a="hookSave">Simpan</button></div>`);
}
function importData(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (Array.isArray(j.tx)) D = { ...DEF(), ...j };
      else if (Array.isArray(j.transactions)) {
        const o = fromOld({ transactions: j.transactions, categories: j.categories, savings: j.savings, settings: j.settings });
        const ids = new Set(D.tx.map(x => x.id)), gids = new Set(D.goals.map(x => x.id));
        D.tx = [...D.tx, ...o.tx.filter(x => !ids.has(x.id))];
        D.goals = [...D.goals, ...o.goals.filter(x => !gids.has(x.id))];
        ['in', 'out'].forEach(k => o.cats[k].forEach(c => { if (!D.cats[k].includes(c)) D.cats[k].push(c); }));
        if (!D.user) D.user = o.user;
        ['discord', 'script', 'sheet'].forEach(k => { if (!D.hook[k]) D.hook[k] = o.hook[k]; });
      }
      else throw 0;
      save(); render(); toast('Data berhasil dipulihkan');
    } catch (e) { toast('File backup tidak dikenali'); }
  };
  r.readAsText(f); inp.value = '';
}

/* ========== Aksi ========== */
const A = {
  close: closeSheet,
  tab: d => { const dir = TABS.findIndex(t => t[0] === d.v) - TABS.findIndex(t => t[0] === UI.tab); if (!dir) { const g = $('.nt.on svg'); if (g) { g.style.animation = 'none'; void g.getBoundingClientRect(); g.style.animation = ''; } return scrollTo({ top: 0, behavior: 'smooth' }); } UI.tab = d.v; scrollTo(0, 0); render({ dx: dir > 0 ? 46 : -46 }); },
  theme: () => { D.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); render(); },
  setTheme: d => { D.theme = d.v; save(); render(); },
  mPrev: () => { UI.ym = shift(UI.ym, -1); UI.cat = 0; render({ dx: -46 }); },
  mNext: () => { UI.ym = shift(UI.ym, 1); UI.cat = 0; render({ dx: 46 }); },
  catPrev: () => { const n = stats(ymKey(UI.ym)).cats.length || 1; UI.cat = (UI.cat - 1 + n) % n; render(); },
  catNext: () => { const n = stats(ymKey(UI.ym)).cats.length || 1; UI.cat = (UI.cat + 1) % n; render(); },
  cPrev: () => { UI.cal = shift(UI.cal, -1); UI.day = null; render({ dx: -46 }); },
  cNext: () => { UI.cal = shift(UI.cal, 1); UI.day = null; render({ dx: 46 }); },
  day: d => { UI.day = d.v; render(); },
  ft: d => { UI.ft = d.v; render(); },
  txNew: d => txSheet(null, d.v),
  txEdit: d => txSheet(d.id),
  txType: d => { TX.t = d.v; TX.c = D.cats[d.v][0] || null; paintTx(); },
  txCat: d => { TX.c = d.v; paintTx(); },
  txCatNew: () => {
    const n = (prompt('Nama kategori baru') || '').trim(); if (!n) return;
    if (!D.cats[TX.t].includes(n)) D.cats[TX.t].push(n);
    TX.c = n; save(); paintTx();
  },
  txSave: () => {
    const a = calc($('#f-a').value), d = $('#f-d').value;
    if (!(a > 0)) return toast('Masukkan nominal yang valid');
    if (!d) return toast('Pilih tanggal');
    const c = TX.c || D.cats[TX.t][0] || 'Lainnya';
    const rec = { id: TX.id || uid(), t: TX.t, n: $('#f-n').value.trim() || c, a: Math.round(a * 100) / 100, c, d, note: $('#f-note').value.trim() };
    if (TX.id) D.tx[D.tx.findIndex(x => x.id === TX.id)] = rec; else { D.tx.unshift(rec); notify(rec); }
    save(); sync(rec); closeSheet(); render(); toast(TX.id ? 'Transaksi diubah' : 'Transaksi tersimpan');
  },
  txDel: d => confirmSheet('Hapus transaksi', 'Transaksi ini akan dihapus permanen.', 'txDelOk', d.id),
  txDelOk: d => { const t = D.tx.find(x => x.id === d.id); D.tx = D.tx.filter(x => x.id !== d.id); save(); if (t) sync(t, 'delete'); closeSheet(); render(); toast('Transaksi dihapus'); },
  goalNew: () => goalSheet(null),
  goalEdit: d => goalSheet(d.id),
  goalOpen: d => goalView(d.id),
  goalSave: () => {
    const n = $('#g-n').value.trim(), tg = calc($('#g-t').value), due = $('#g-d').value || '';
    if (!n) return toast('Masukkan nama target');
    if (!(tg > 0)) return toast('Masukkan nominal target');
    if (UI.gid) Object.assign(D.goals.find(x => x.id === UI.gid), { n, tg, due });
    else { const c = calc(($('#g-c') || {}).value) || 0; D.goals.push({ id: uid(), n, tg, cur: c > 0 ? c : 0, due, log: [] }); }
    save(); closeSheet(); render(); toast('Target tersimpan');
  },
  goalDel: d => confirmSheet('Hapus target', 'Target dan riwayat setorannya akan dihapus.', 'goalDelOk', d.id),
  goalDelOk: d => { D.goals = D.goals.filter(x => x.id !== d.id); save(); closeSheet(); render(); toast('Target dihapus'); },
  dep: d => {
    const g = D.goals.find(x => x.id === UI.gid), a = calc($('#g-amt').value), s = +d.v;
    if (!g) return;
    if (!(a > 0)) return toast('Masukkan nominal');
    if (s < 0 && a > g.cur) return toast('Melebihi dana yang terkumpul');
    g.cur += s * a; (g.log = g.log || []).unshift({ d: TODAY(), a: s * a });
    save(); render(); goalView(g.id); toast(s > 0 ? 'Setoran dicatat' : 'Dana ditarik');
  },
  limit: () => openSheet(`<h3>Batas pengeluaran bulanan</h3>
    <label>Batas per bulan (Rp)<input id="l-a" inputmode="decimal" placeholder="0" value="${D.limit || ''}"></label>
    <div class="hint">Isi 0 untuk menghapus batas.</div>
    <div class="row"><button class="btn" data-a="close">Batal</button><button class="btn dark" data-a="limitSave">Simpan</button></div>`),
  limitSave: () => { const v = calc($('#l-a').value); D.limit = v > 0 ? v : 0; save(); closeSheet(); render(); toast(D.limit ? 'Batas disimpan' : 'Batas dihapus'); },
  cats: catSheet,
  ctype: d => { UI.ctype = d.v; catSheet(); },
  cdel: d => { D.cats[UI.ctype].splice(+d.i, 1); save(); catSheet(); },
  cadd: () => { const n = $('#c-n').value.trim(); if (!n) return toast('Isi nama kategori'); if (!D.cats[UI.ctype].includes(n)) D.cats[UI.ctype].push(n); save(); catSheet(); },
  hooks: hookSheet,
  hookSave: () => { D.hook = { discord: $('#h-d').value.trim(), script: $('#h-s').value.trim(), sheet: $('#h-l').value.trim() }; save(); closeSheet(); render(); toast('Integrasi disimpan'); },
  openSheetLink: () => window.open(D.hook.sheet, '_blank', 'noopener'),
  export: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' }));
    a.download = 'dompetku-backup-' + TODAY() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup diunduh');
  },
  import: () => $('#imp').click(),
  reset: () => confirmSheet('Hapus semua data', 'Semua transaksi, target, dan pengaturan akan dihapus permanen.', 'resetOk'),
  resetOk: () => { D = DEF(); save(); closeSheet(); UI.tab = 'home'; render(); toast('Semua data dihapus'); }
};

/* ========== Render & event ========== */
const TABS = [['home', 'Beranda'], ['goal', 'Target'], ['hist', 'Riwayat'], ['me', 'Akun']];
function countUp(el) {
  const to = +el.dataset.n; if (!to) return;
  const t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 4);
    el.innerHTML = big(to * e);
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}
function render(anim) {
  theme();
  const v = $('#view'), n = $('#nav');
  if (anim) { v.style.setProperty('--dx', (anim.dx || 0) + 'px'); v.style.setProperty('--dy', (anim.dy || 0) + 'px'); v.classList.add('enter'); }
  else v.classList.remove('enter');
  v.innerHTML = V[UI.tab]();
  if (!n.firstChild) n.innerHTML = `<div class="np">${TABS.map(([k, l]) => `<button class="nt" data-a="tab" data-v="${k}" aria-label="${l}">${ico(k, 22)}<span>${l}</span></button>`).join('')}</div>`;
  n.querySelectorAll('.nt').forEach(b => b.classList.toggle('on', b.dataset.v === UI.tab));
  if (anim && !matchMedia('(prefers-reduced-motion:reduce)').matches) setTimeout(() => v.querySelectorAll('[data-n]').forEach(countUp), 150);
}
document.addEventListener('click', e => {
  if (e.target === $('#ov')) return closeSheet();
  const b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { UI.q = t.value; $('#hlist').innerHTML = histList(); }
  if (t.id === 'f-a') { const v = calc(t.value); $('#f-prev').textContent = isNaN(v) ? '' : (/[+\-*/×÷]/.test(t.value) ? '= ' : '') + rp(v); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'u-n') { D.user = e.target.value.trim(); save(); render(); }
  if (e.target.id === 'imp') importData(e.target);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (D.theme === 'auto') render(); });
if (!localStorage.getItem(KEY)) save();
render({ dy: 30 });

</script>
</body>
</html>
